<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1d2b21 0,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.wrap{max-width:1000px;margin:0 auto;padding:16px}
.logo{text-align:center;padding:40px 0 16px}
.logo .ic{font-size:64px;filter:drop-shadow(0 0 18px #f2b13466)}
.logo h1{font-size:46px;color:var(--ac);text-shadow:0 0 22px #f2b13455}
.logo p{color:var(--mut);margin:6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}

button.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}

button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.big{font-family:"Courier New",monospace;font-size:34px;color:var(--ac);letter-spacing:.35em;text-align:center}
.mut{color:var(--mut);font-size:14px}

.pl{border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:12px;margin:8px 0}

.pl.me{border-color:#f2b13488}
.pl.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

.rv{font-size:14px;margin:2px 0}.rv b{color:var(--mut);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:99px;display:none;z-index:9;max-width:90%}
details summary{cursor:pointer;color:var(--ac)}details p{color:var(--mut);font-size:14px}

body:before{content:"";display:block;height:8px;background:repeating-linear-gradient(-45deg,var(--ac) 0 14px,#111 14px 28px)}
.panel{box-shadow:0 8px 24px #0007,inset 0 1px 0 #ffffff0d}.panel.alert{box-shadow:0 0 28px #e5534b22}.panel.safe{box-shadow:0 0 28px #5fd38d1c}
h3{text-transform:uppercase;font-size:15px}.hint{font-size:12px;color:var(--ac2);margin-top:2px}.tag.bad{color:var(--red);border-color:#e5534b88}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.rm{border-radius:10px;padding:9px;border:1px solid var(--line);background:var(--bg2);font-size:14px}.rm span{display:block;font-size:12px;color:var(--mut)}
.rm.g{border-color:#5fd38d88}.rm.g span{color:var(--ac2)}.rm.b{border-color:#4da3ff88}.rm.b span{color:#4da3ff}.rm.y{border-color:#f2b13488}.rm.y span{color:var(--ac)}.rm.r{border-color:#e5534b88}.rm.r span{color:var(--red)}
.pl{background:linear-gradient(160deg,var(--bg2),#0e1510)}.logo h1{font-size:54px}
.narrow{max-width:500px;margin:0 auto}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 8px 24px #0007}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
th{background:#0e1510;color:var(--mut);padding:10px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

td:first-child,th:first-child{position:sticky;left:0;background:#0f1711;z-index:1;font-weight:700;text-align:left;white-space:nowrap}
tr.me td{background:#1c2a1f}tr.me td:first-child{background:#1c2a1f}tr.out{opacity:.4}tr.sel td{background:#2a1513}td.e{color:#3b4b40;letter-spacing:.2em}

.narrow .panel{backdrop-filter:blur(10px);background:#111a14d9;border-color:#35503d}

button:not(.sm):active{transform:scale(.98)}
.stats{grid-template-columns:1fr 1fr!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0007}
.ar{display:grid;grid-template-columns:40% 1fr;border-top:1px solid var(--line);align-items:center}.ar:first-child{border-top:0}
.al{padding:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.av{display:flex;gap:12px;align-items:center;padding:10px 14px;border-left:1px solid var(--line);min-height:58px}

.ib{width:22px;height:22px;padding:0;margin:0;border-radius:50%;background:#fff!important;color:#111;font:700 14px/22px Georgia,serif;flex:none;box-shadow:none!important;letter-spacing:0}
</style>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.random()*a.length|0],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const K=[['pro','Профессия'],['bio','Биология'],['trait','Характер'],['hp','Здоровье'],['hob','Хобби'],['fear','Фобия'],['skill','Навык'],['bag','Багаж'],['fact','Факт']];
const L=s=>s.split('|');let hints=true;
const D={
pro:L(`Хирург|Терапевт|Фельдшер|Анестезиолог~врач, который обезболивает при операциях|Стоматолог|Психиатр|Эпидемиолог~учёный по болезням и эпидемиям|Инженер-атомщик|Электрик|Сантехник|Агроном~специалист по выращиванию растений|Фермер|Повар|Сапёр|Учитель|Психолог|Программист|Генетик|Строитель|Автомеханик|Охотник|Журналист|Юрист|Пекарь|Актёр|Музыкант|Пожарный|Священник|Блогер|Ветеринар|Химик|Радиотехник|Библиотекарь|Курьер|Плотник|Метеоролог~предсказывает погоду|Геолог|Военный лётчик|Бухгалтер|Модель|Таксист|Сварщик|Фармацевт|Спасатель|Дизайнер|Банкир|Уборщик|Политик|Олимпийский спортсмен|Шахтёр|Слесарь`),
trait:L(`Прирождённый лидер|Трус|Агрессивный|Добряк~помогает всем, даже в ущерб себе|Лжец|Параноик~везде видит угрозу|Оптимист|Ленивец|Трудоголик|Эгоист|Конфликтный|Хладнокровный|Мудрый|Вспыльчивый|Обаятельный|Нытик|Упрямый|Склонен к панике|Мечтатель|Ответственный`),
hp:L(`Абсолютно здоров|Слабый иммунитет|Астма~хроническое заболевание лёгких, нужен ингалятор|Диабет 1 типа~нужен инсулин, без него смертельно|Аллергия на пыль|Хромота|Плохое зрение (−7)|Бессонница|Гипертония~повышенное давление|Железное здоровье|Ремиссия после рака|Бесплодие|Аллергия на лекарства|Эпилепсия~припадки без предупреждения|Гепатит C~заразен через кровь|Остеопороз~хрупкие кости|Глухота на одно ухо|Отличная физическая форма|Депрессия|Сердечная недостаточность|Дальтонизм|Алкогольная зависимость|Нет двух пальцев|Беременность, 5 месяцев~потребует особой заботы`),
hob:L(`Садоводство|Шахматы|Вязание|Радиолюбитель~сам собирает радиоприёмники|Скалолазание|Кулинария|Рыбалка|Стрельба из лука|Гитара|Резьба по дереву|Видеоигры|Йога|Астрономия|Нумизматика~коллекционирование монет|Танцы|Паркур|Фокусы|Выживание в лесу|Стендап|Пчеловодство|Дайвинг|Рисование|Литература|Гадание на картах|Бодибилдинг|Рукоделие|Покер`),
fear:L(`Темноты|Замкнутых пространств~клаустрофобия, в бункере тяжело|Крови|Змей|Высоты|Толпы|Крыс|Воды|Одиночества|Огня|Микробов~мизофобия|Пауков|Громких звуков|Врачей|Тишины|Собак|Закрытых дверей|Глубины|Грозы|Потерять контроль|Людей в масках|Насекомых|Нет страхов, и это тревожно`),
skill:L(`Первая помощь|Ремонт техники|Выращивание овощей|Рукопашный бой|Иностранные языки|Лидерство|Выживание в дикой природе|Дипломатия|Готовка из ничего|Преподавание|Взлом замков|Строительство|Пение, поднимающее дух|Феноменальная память|Шитьё|Азбука Морзе|Меткая стрельба|Вождение любой техники|Знает карту подземных ходов|Очистка воды|Радиосвязь|Гипноз~может убедить почти любого|Распознаёт ложь|Паяльное дело|Знание лекарственных трав|Принимает роды|Быстрый счёт в уме`),
bag:L(`Аптечка|Набор инструментов|Семена овощей|Ящик консервов|Гитара|Радиоприёмник|Ружьё без патронов|Библия|Книга «Как выжить»|Генератор|Фонарь и батарейки|Бутылка виски|Колода карт|Спальный мешок|Рация|Ноутбук без интернета|Плюшевый медведь|Сухпаёк на неделю|Фильтр для воды|Дозиметр~прибор, измеряющий радиацию|Набор для шитья|Топор|Рюкзак лекарств|Газовая плита|Кот в переноске|Ничего|Мешок муки|Катушка проводов|Противогазы, 5 штук|Саженцы яблонь`),
fact:L(`Скрывает судимость|Тайно богат|Знает код от запасного выхода|Бывал в таком бункере|Лунатик|Громко храпит|Умеет водить вертолёт|Бывший агент спецслужб|Верит в теории заговора|Автор бестселлера|Редкая группа крови~подходит в доноры лишь немногим|Постоянно врёт|Бывший заключённый|Работал в МЧС|Мастер на все руки|Знает язык жестов|Владеет секретной информацией|Победитель шоу выживания|Клептоман~тянет воровать, даже без нужды|Обожает командовать|Тайно болен`)};
const CAT=L(`Ядерная война~Города разрушены, на поверхности радиация.|Пандемия «Зеро»~Смертельный вирус, снаружи заражённые зоны.|Падение астероида~Пыль закрыла солнце, наступила ядерная зима.|Восстание машин~ИИ захватил сети, по улицам охотятся дроны.|Супервулкан~Пепел покрыл континенты, урожаи невозможны.|Зомби-вирус~Заражённые заполнили города.|Климатический коллапс~Океаны поднялись, суша выжжена.|Вторжение пришельцев~Корабли над городами, сопротивление бесполезно.|Мутация растений~Растения стали ядовитыми и хищными.|Магнитная буря~Вся электроника сгорела, цивилизация отброшена назад.|Новый ледниковый период~Температура упала до −60 °C.|Химическая катастрофа~Воздух отравлен, дышать можно только в фильтрах.|Глобальный голод~Урожаи погибли, вспыхнули войны за еду.|Мегацунами~Волны смыли побережья, суша затоплена.|Грибковая эпидемия~Споры превращают людей в агрессивных тварей.|Солнечная вспышка~Озоновый слой разрушен, днём на улице смертельно.|Биологическая война~Лабораторные бактерии вышли из-под контроля.`).map(x=>x.split('~'));
const BK=L(`Бункер «Авангард»~Новейший военный бункер с оранжереей и автономным реактором.|Бывшая шахта~Глубоко и безопасно, но сыро и мало света.|Метро-убежище~Просторные тоннели, вода требует фильтрации.|Подземный торговый центр~Много вещей, но слабая защита входа.|Научная станция~Лаборатории и оборудование, жилых блоков мало.|Крепость-погреб~Старинные подвалы с толстыми стенами, тесно.|Бункер миллиардера~Роскошь, кинозал и бассейн, но запасы малы.|Секретный объект СССР~Старая техника, огромные склады, ржавчина.|Пещерный комплекс~Природная защита, вентиляция нестабильна.`).map(x=>x.split('~'));
const RM=L(`Жилой отсек|Склад продуктов|Медпункт|Оранжерея|Мастерская|Командный центр|Генераторная|Оружейная|Спортзал|Лаборатория|Вентиляционная|Столовая|Водоочистная станция`);
const ST={'в идеальном состоянии':'g','в хорошем состоянии':'g','частично повреждена':'y','затоплена':'b','пустая':'m','заражена плесенью':'r','разрушена':'r','заперта, нужен код':'y'};
const SK=Object.keys(ST);
function gen(){const o={bio:pick(['Мужчина','Женщина'])+', '+(()=>{const a=18+Math.random()*55|0;return a+' '+nn(a,['год','года','лет'])})()};
 for(const k in D)o[k]=pick(D[k]);
 if(!o.fear.startsWith('Нет'))o.fear='Боязнь '+o.fear[0].toLowerCase()+o.fear.slice(1);return o}
function mkBk(n){let s=Math.round(n*(.3+Math.random()*.4));s=Math.min(n-1,Math.max(1,s));
 const du=6+Math.random()*114|0,fo=Math.max(3,Math.round(du*(.5+Math.random()*.9))),b=pick(BK);
 const rm=[...RM].sort(()=>Math.random()-.5).slice(0,3+(Math.random()*2|0)).map(r=>[r,pick(SK)]);
 return{s,b:{n:b[0],d:b[1],a:Math.round(s*(20+Math.random()*60)/10)*10+30,du,fo,rm}}}
const nn=(n,w)=>{n=Math.abs(n)%100;const d=n%10;return n>10&&n<20?w[2]:d>1&&d<5?w[1]:d==1?w[0]:w[2]};const rc=()=>Array.from({length:3},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*62|0]).join('');
const fm=m=>{const y=m/12|0,o=m%12;return((y?y+' '+nn(y,['год','года','лет'])+' ':'')+(o?o+' '+nn(o,['месяц','месяца','месяцев']):'')).trim()||'0 месяцев'};
const openH=new Set(),LK=o=>`<svg viewBox="0 0 24 24" width="26" height="26"><rect x="4.5" y="11" width="15" height="10.5" rx="2.2" fill="currentColor"/><path d="${o?'M8 11V7.5a4 4 0 0 1 7.6-1.7':'M8 11V7.5a4 4 0 0 1 8 0V11'}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const fv=(v,show)=>{const[a,b]=String(v).split('~');return esc(a)+(show&&b?`<div class="hint">ℹ ${esc(b)}</div>`:'')};
const bindHn=()=>{const e=$('#hn');if(e)e.onchange=()=>{hints=e.checked;render()}};
function bkHtml(c,b,seats){const ok=b.fo>=b.du;
 return `<div class="panel alert"><h3>⚠ ${esc(c[0])}</h3><div class="mut">${esc(c[1])}</div><div style="margin-top:8px"><span class="tag ac">Сидеть в бункере: ${fm(b.du)}</span></div></div>
 <div class="panel safe"><h3>🛡 ${esc(b.n)}</h3><div class="mut">${esc(b.d)}</div><div style="margin-top:8px"><span class="tag ac">${seats} ${nn(seats,['место','места','мест'])}</span><span class="tag">Площадь: ${b.a} м²</span><span class="tag ${ok?'':'bad'}">Еды на: ${fm(b.fo)}</span></div>
 <div class="rooms">${b.rm.map(([r,t])=>`<div class="rm ${ST[t]}"><i>${{g:'✅',y:'⚠️',b:'🌊',m:'📭',r:'☠️'}[ST[t]]}</i><b>${esc(r)}</b><span>${esc(t)}</span></div>`).join('')}</div></div>`}
let room=null,name='',card=null,isHost=false,off=null,code='';
const myId=((crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now())+'').replace(/\W/g,'').slice(0,12);
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'err'),{code:j.error||'net'});return j});
const R={async join(c,create){
 await api('join',{code:c,id:myId,create:!!create});
 let peers=[],subs=[],first=null;
 const es=new EventSource('/api/events?code='+c+'&id='+myId);
 await new Promise((ok,no)=>{first=ok;es.onmessage=e=>{peers=JSON.parse(e.data);if(first){first();first=null}else subs.forEach(f=>f())};setTimeout(()=>no(new Error('timeout')),8000)});
 return{peers:()=>peers.map(p=>({peer:p.peer,isMe:p.peer===myId,sameTab:p.peer===myId,presence:p.presence})),
 presence:p=>api('presence',{code:c,id:myId,patch:p}),
 onPeers:f=>{subs.push(f);return()=>{subs=subs.filter(x=>x!==f)}},
 leave:async()=>{es.close();subs=[];try{await api('leave',{code:c,id:myId})}catch(e){}}}
}};
try{name=localStorage.getItem('bk_name')||''}catch(e){}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function menu(msg){
 app.className='narrow';app.innerHTML=`<div class="logo"><div class="door"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1a241d" stroke="#f2b134" stroke-width="3"/><circle cx="50" cy="50" r="42" fill="none" stroke="#5a7562" stroke-width="3" stroke-dasharray="2 9.4"/><circle cx="50" cy="50" r="36" fill="#121a15" stroke="#2f4636" stroke-width="2"/><g class="wheel" stroke="#f2b134" stroke-width="4" stroke-linecap="round"><path d="M50 16V84M16 50H84M26 26L74 74M74 26L26 74"/></g><circle cx="50" cy="50" r="15" fill="#0b0f0c" stroke="#f2b134" stroke-width="3"/><g fill="#f2b134"><circle cx="50" cy="50" r="2.6"/><path id="bl" d="M47.5 45.67L43.5 38.74A13 13 0 0 1 56.5 38.74L52.5 45.67A5 5 0 0 0 47.5 45.67Z"/><use href="#bl" transform="rotate(120 50 50)"/><use href="#bl" transform="rotate(240 50 50)"/></g></svg></div>
<h1>БУНКЕР</h1><div class="stripe"></div><p>Кто попадёт в убежище, а кто останется снаружи?</p>
<div class="feat"><span>👥 2–12 игроков</span><span>🔑 вход по коду</span><span>🚫 без регистрации</span></div></div>
 <div class="panel"><input id="nm" maxlength="16" placeholder="Ваше имя" value="${esc(name)}">
 <button id="mk">Создать комнату</button></div>
 <div class="panel"><div class="mut" style="margin-bottom:8px">Войти по коду комнаты (3 символа, важен регистр)</div>
 <input id="cd" class="code" maxlength="3" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="a8L"><button class="sec" id="jn">Войти</button></div>
 <div class="panel"><details><summary>Как играть</summary><p>Каждый получает секретную карточку: профессия, здоровье, хобби, фобия, навык, багаж и факт. В бункере хватит места только половине игроков. В каждом раунде раскрывайте по одной характеристике, убеждайте остальных, что вы полезны, затем голосуйте за исключение. Побеждают те, кто остался в бункере.</p></details></div>
 ${msg?`<div class="mut" style="text-align:center">${esc(msg)}</div>`:''}`;
 $('#cd').oninput=e=>{e.target.value=e.target.value.replace(/[^A-Za-z0-9]/g,'')};$('#mk').onclick=()=>start(true);$('#jn').onclick=()=>start(false);
}
async function start(create){
 const nm=$('#nm').value.trim();if(!nm)return toast('Введите имя');
 name=nm;try{localStorage.setItem('bk_name',nm)}catch(e){}
 const c=$('#cd').value.trim();if(!create&&!/^[A-Za-z0-9]{3}$/.test(c))return toast('Код — 3 символа: буквы и цифры');
 document.querySelectorAll('button').forEach(b=>b.disabled=true);
 let ok=false;
 if(create){for(let i=0;i<5&&!ok;i++){ok=await enter(rc(),true)}}
 else ok=await enter(c,false);
 if(!ok&&!$('#nm'))return;if(!ok)menu(create?'Не удалось создать комнату, попробуйте ещё раз':'');
}
async function enter(c,create){
 let r;try{r=await R.join(c,create)}catch(e){const m={notfound:'Комната не найдена',started:'Игра уже идёт',full:'Комната заполнена'}[e.code];if(m)toast(m);else if(e.code!=='exists')toast('Нет соединения с сервером');return false}
 room=r;code=c;isHost=create;card=gen();
 await room.presence(Object.assign({n:name,r:{},v:null,rc:0},create?{h:1,ph:'lobby',rd:0,out:[],seats:0,cat:0,bk:0,res:''}:{}));
 off=room.onPeers(render);render();return true;
}
async function leave(){if(off)off();try{await room.leave()}catch(e){}room=null;menu()}
const hp=()=>{const h=room.peers().find(p=>p.presence.h);return h?h.presence:null};
function render(){
 if(!room)return;const H=hp();
 if(!H){toast('Основатель покинул комнату');return leave()}
 const peers=room.peers(),pl=peers.filter(p=>p.presence.n).sort((a,b)=>a.peer<b.peer?-1:1);
 const me=peers.find(p=>p.isMe&&p.sameTab);if(!me)return;
 const alive=p=>!H.out.includes(p.peer),al=pl.filter(alive),meOut=!alive(me);
 if(H.ph==='play'&&me.presence.v)room.presence({v:null});
 const head=`<div class="row" style="margin-top:8px"><div><h2 style="color:var(--ac)">☢ БУНКЕР</h2><div class="mut">Комната ${code}</div></div><button class="sec sm" style="flex:none" id="lv">Выйти</button></div>`;
 if(H.ph==='lobby'){
  app.className='narrow';app.innerHTML=head+`<div class="panel"><div class="mut" style="text-align:center">Код комнаты — сообщите его друзьям</div><div class="big">${code}</div></div>
  <div class="panel"><h3>Игроки (${pl.length})</h3>${pl.map(p=>`<div class="attr"><div class="v">${p.isMe?'⭐ ':'👤 '}${esc(p.presence.n)}${p.presence.h?' <span class="tag ac">основатель</span>':''}</div></div>`).join('')}</div>
  ${isHost?`<button id="go" ${pl.length<2?'disabled':''}>Начать игру${pl.length<2?' (нужно минимум 2)':''}</button>`:'<div class="mut" style="text-align:center">Ждём, пока основатель начнёт игру…</div>'}`;
  $('#lv').onclick=leave;bindHn();
  if(isHost)$('#go').onclick=()=>{const o=mkBk(pl.length);room.presence({ph:'play',rd:1,out:[],res:'',cat:Math.random()*CAT.length|0,bk:o.b,seats:o.s})};
  return;
 }
 const c=CAT[H.cat],b=H.bk,ph={play:'Раскрытие характеристик',vote:'Голосование',end:'Игра окончена'}[H.ph];
 const canRv=H.ph==='play'&&!meOut&&me.presence.rc<H.rd;
 let h=head+`<div class="stats"><div><b>${H.seats}</b>${nn(H.seats,['место','места','мест'])} в бункере</div><div><b>${al.length}</b>${nn(al.length,['игрок','игрока','игроков'])} в игре</div></div>
 ${bkHtml(c,b,H.seats)}
 ${H.res?`<div class="panel"><b>${esc(H.res)}</b></div>`:''}`;
 if(H.ph==='end'){h+=`<div class="panel safe"><h3>🏆 Выжившие в бункере</h3><div style="margin-top:8px">${al.map(p=>`<span class="tag ac">${esc(p.presence.n)}</span>`).join('')}</div></div>`}
 const myv=me.presence.v,IC={pro:'💼',bio:'🧬',trait:'🎭',hp:'❤️',hob:'🎲',fear:'😱',skill:'🛠️',bag:'🎒',fact:'📌'},f0=v=>esc(String(v).split('~')[0]);
 h+=`<div class="sec"><h3>🪪 Ваша карточка${meOut?' · исключён':''}</h3><div class="mut">Нажмите на замок, чтобы раскрыть характеристику остальным</div></div><div class="card">`
 +K.map(([k,l])=>{const rv=k in me.presence.r,hs=String(card[k]).includes('~');return `<div class="ar"><div class="al">${l}${hs?`<button class="ib" data-ih="${k}">i</button>`:''}</div><div class="av"><button class="lk ${rv?'on':''}" data-rv="${k}">${LK(rv)}</button><div>${fv(card[k],openH.has(k))}</div></div></div>`}).join('')
 +`</div><div class="sec"><h3>📊 Таблица раскрытий</h3></div><div class="tw"><table><tr><th>Игрок</th>${K.map(([k,l])=>`<th>${IC[k]}<br>${l}</th>`).join('')}${H.ph==='vote'?'<th>Голос</th>':''}</tr>`
 +pl.map(p=>{const o=!alive(p),r=p.presence.r;return `<tr class="${o?'out':''} ${p.isMe?'me':''} ${myv===p.peer?'sel':''}"><td>${p.isMe?'⭐ ':''}${esc(p.presence.n)}${o?' ❌':''}</td>${K.map(([k])=>k in r?`<td>${f0(r[k])}</td>`:'<td class="e">•••</td>').join('')}${H.ph==='vote'?`<td>${!meOut&&!o&&!p.isMe?`<button class="sm ${myv===p.peer?'':'sec'}" data-vt="${p.peer}">${myv===p.peer?'✔ Ваш':'Исключить'}</button>`:''}</td>`:''}</tr>`}).join('')+`</table></div>`;
 if(isHost){
  if(H.ph==='play')h+=`<button id="hv">К голосованию</button>`;
  if(H.ph==='vote'){const n=al.filter(p=>p.presence.v).length;h+=`<div class="mut" style="text-align:center;margin-top:10px">Проголосовало: ${n} из ${al.length}</div><button id="ht">Подвести итоги</button>`}
 }else if(H.ph==='play')h+=`<div class="mut" style="text-align:center;margin-top:10px">Основатель начнёт голосование, когда все раскроются</div>`;
 app.className='';app.innerHTML=h;$('#lv').onclick=leave;bindHn();
 document.querySelectorAll('[data-rv]').forEach(e=>e.onclick=()=>{const k=e.dataset.rv;if(k in me.presence.r)return;if(!canRv)return toast(meOut?'Вы исключены':H.ph!=='play'?'Сейчас раскрывать нельзя':'В этом раунде вы уже раскрыли характеристику');room.presence({r:Object.assign({},me.presence.r,{[k]:card[k]}),rc:H.rd})});
 document.querySelectorAll('[data-ih]').forEach(e=>e.onclick=()=>{const k=e.dataset.ih;openH.has(k)?openH.delete(k):openH.add(k);render()});
 document.querySelectorAll('[data-vt]').forEach(e=>e.onclick=()=>room.presence({v:e.dataset.vt}));
 if($('#hv'))$('#hv').onclick=()=>room.presence({ph:'vote'});
 if($('#ht'))$('#ht').onclick=()=>{
  const cnt={};al.forEach(p=>{const v=p.presence.v;if(v&&al.some(x=>x.peer===v))cnt[v]=(cnt[v]||0)+1});
  let ids=Object.keys(cnt),mx=Math.max(0,...ids.map(i=>cnt[i]));
  let top=ids.filter(i=>cnt[i]===mx);if(!top.length)top=al.map(p=>p.peer);
  const vic=pick(top),vp=al.find(p=>p.peer===vic),out=H.out.concat(vic),left=al.length-1;
  const end=left<=H.seats;
  room.presence({out,rd:H.rd+1,ph:end?'end':'play',res:'Исключён из бункера: '+vp.presence.n+(mx?' ('+mx+' '+nn(mx,['голос','голоса','голосов'])+')':' (жребий)')+(end?'. Бункер заполнен!':'')});
 };
}

(function(){
 const W=800,sv=document.querySelector('#bg svg');let o='';
 [['#0d140f',60,130,14,34,0],['#060907',90,170,18,46,1]].forEach(([c,lo,hi,mn,mx,k])=>{let x=-10,p='M-10 200';
  while(x<W+20){const w=mn+Math.random()*(mx-mn),h=200-(lo+Math.random()*(hi-lo)),t=Math.random()<.5?(Math.random()*14|0):0;
   p+=`L${x} ${h+t}L${x+w*.6} ${h-t*.4}L${x+w} ${h+t*1.5}`;x+=w+(k?2:4)}
  o+=`<path d="${p}L${W+20} 200Z" fill="${c}"/>`});
 sv.innerHTML=o+'<rect y="190" width="800" height="10" fill="#030403"/>';
 const cv=document.getElementById('ash'),g=cv.getContext('2d');let P=[];
 const sz=()=>{cv.width=innerWidth;cv.height=innerHeight};sz();addEventListener('resize',sz);
 for(let i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.6+Math.random()*1.8,v:.2+Math.random()*.6,s:Math.random()*6,e:Math.random()<.3});
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 (function f(){g.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.s+=.01;p.x+=Math.sin(p.s)*.4;if(p.y>cv.height){p.y=-5;p.x=Math.random()*cv.width}
  g.fillStyle=p.e?'rgba(255,170,60,.75)':'rgba(190,200,190,.35)';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});requestAnimationFrame(f)})();
})();
menu();
</script>
