<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.random()*a.length|0],sleep=ms=>new Promise(r=>setTimeout(r,ms));

const L=s=>s.split('|');let hints=true;
const D={

 return{peers:()=>peers.map(p=>({peer:p.peer,isMe:p.peer===myId,sameTab:p.peer===myId,presence:p.presence})),
 presence:p=>api('presence',{code:c,id:myId,patch:p}),

 <div class="panel"><details><summary>Как играть</summary><ol class="how"><li><b>Карточка.</b> У каждого тайная карточка: профессия, здоровье, характер, фобия, навык и другое.</li><li><b>Бункер.</b> Мест хватит примерно половине игроков, а еды на ограниченный срок.</li><li><b>Раскрытие.</b> В каждом раунде нажмите на замок и откройте одну характеристику всем.</li><li><b>Голосование.</b> Обсудите и проголосуйте, кто покинет бункер.</li><li><b>Победа.</b> Выживают те, кто остался, когда мест не осталось.</li></ol></details></div>
 ${msg?`<div class="mut" style="text-align:center">${esc(msg)}</div>`:''}`;
 $('#cd').oninput=e=>{e.target.value=e.target.value.replace(/[^A-Za-z0-9]/g,'')};$('#mk').onclick=()=>start(true);$('#jn').onclick=()=>start(false);

async function start(create){
 const nm=$('#nm').value.trim();if(!nm)return toast('Введите имя');
 name=nm;try{localStorage.setItem('bk_name',nm)}catch(e){}
 const c=$('#cd').value.trim();if(!create&&!/^[A-Za-z0-9]{3}$/.test(c))return toast('Код — 3 символа: буквы и цифры');
 document.querySelectorAll('button').forEach(b=>b.disabled=true);
 let ok=false;
 if(create){for(let i=0;i<5&&!ok;i++){ok=await enter(rc(),true)}}
 else ok=await enter(c,false);
 if(!ok&&!$('#nm'))return;if(!ok)menu(create?'Не удалось создать комнату, попробуйте ещё раз':'');
}
async function enter(c,create){
 let r;try{r=await R.join(c,create)}catch(e){const m={notfound:'Комната не найдена',started:'Игра уже идёт',full:'Комната заполнена'}[e.code];if(m)toast(m);else if(e.code!=='exists')toast('Нет соединения с сервером');return false}
 room=r;code=c;isHost=create;card=gen();lastRes='';prevR={};pg=0;tl=0;dir='';
 await room.presence(Object.assign({n:name,r:{},v:null,rc:0},create?{h:1,ph:'lobby',rd:0,out:[],seats:0,cat:0,bk:0,res:''}:{}));
 off=room.onPeers(render);render();return true;
}
async function leave(){if(off)off();try{await room.leave()}catch(e){}room=null;menu()}
const hp=()=>{const h=room.peers().find(p=>p.presence.h);return h?h.presence:null};
function render(){
 if(!room)return;const H=hp();
 if(!H){toast('Основатель покинул комнату');return leave()}
 const peers=room.peers(),pl=peers.filter(p=>p.presence.n).sort((a,b)=>a.peer<b.peer?-1:1);
 const me=peers.find(p=>p.isMe&&p.sameTab);if(!me)return;
 const alive=p=>!H.out.includes(p.peer),al=pl.filter(alive),meOut=!alive(me);
 if(H.ph==='play'&&me.presence.v)room.presence({v:null});
 const head=`<div class="row" style="margin-top:8px"><div><h2 style="color:var(--ac)">☢ БУНКЕР</h2><div class="mut">Комната ${code}</div></div><div style="flex:none;display:flex;gap:8px"><button class="sec sm" id="mt">${mute?'🔇':'🔊'}</button><button class="sec sm" id="lv">Выйти</button></div></div>`;
 if(H.ph==='lobby'){
  app.className='narrow';app.innerHTML=head+`<div class="panel"><div class="mut" style="text-align:center">Код комнаты — сообщите его друзьям</div><div class="big">${[...code].map(ch=>`<i>${ch}</i>`).join('')}</div><button class="sec" id="cp">🔗 Пригласить друзей</button></div>
  <div class="panel"><h3>Игроки (${pl.length})</h3>${pl.map(p=>`<div class="attr"><div class="v pr">${av(p.presence.n)}<span>${esc(p.presence.n)}${p.isMe?' · вы':''}</span>${p.presence.h?' <span class="tag ac">основатель</span>':''}</div></div>`).join('')}</div>
  <div class="panel"><h3>Номер персонажа</h3><div class="mut" style="text-align:center">Два игрока не могут иметь один номер. Не выбрали — номер выдадут случайно.</div><div class="nums">${pl.map((_,i)=>{const n=i+1,t=pl.some(q=>!q.isMe&&q.presence.no===n);return `<button class="nb ${me.presence.no===n?'on':''}" data-no="${n}" ${t?'disabled':''}>${n}</button>`}).join('')}</div></div>
  ${isHost?`<button id="go" ${pl.length<2?'disabled':''}>Начать игру${pl.length<2?' (нужно минимум 2)':''}</button>`:'<div class="mut" style="text-align:center">Ждём, пока основатель начнёт игру…</div>'}`;
  $('#lv').onclick=leave;bindHn();
  $('#cp').onclick=invite;document.querySelectorAll('[data-no]').forEach(e=>e.onclick=()=>room.presence({no:+e.dataset.no}));if(isHost)$('#go').onclick=()=>{const o=mkBk(pl.length);room.presence({ph:'play',rd:1,out:[],res:'',ord:mkOrd(pl),cat:Math.random()*CAT.length|0,bk:o.b,seats:o.s})};
  return;
 }
 return game(H,pl,me,alive,head)
}
